<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL DARK PLANET // SYSTEM ACCESS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="terminal-cutout">
        
        <div class="cctv-grid"></div>
        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div class="screen-glare"></div>

        <div class="screen-content">
            
            <div class="status-bar">
                <span>REC [●]</span>
                <span class="time-code">LOADING...</span>
                <span>CAM_04</span>
            </div>

            <div class="center-stage">
                <div class="radar-housing">
                    <div class="radar-sweep"></div>
                    <img src="media/logo-red.png" alt="RDP EYE" class="rdp-eye">
                </div>
            </div>

            <div class="command-zone">
                <p class="cmd-prompt">ENTER_EMAIL_ADDRESS:</p>
                
                <div id="mc_embed_shell">
                    <div id="mc_embed_signup">
                        <form action="YOUR_MAILCHIMP_ACTION_URL_HERE" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate="">
                            
                            <div class="input-wrapper">
                                <span class="arrow">></span>
                                <input type="email" value="" name="EMAIL" class="terminal-input" id="mce-EMAIL" required="" placeholder="___">
                                <button type="submit" class="submit-btn">EXEC</button>
                            </div>

                            <div aria-hidden="true" style="position: absolute; left: -5000px;">
                                <input type="text" name="b_YOUR_TAG_HERE" tabindex="-1" value="">
                            </div>

                        </form>
                    </div>
                </div>
            </div>

            <div class="footer-bar">
                
                <div class="audio-viz" title="TOGGLE AUDIO">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="social-dock">
                    <a href="https://instagram.com" target="_blank" class="social-link">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://tiktok.com" target="_blank" class="social-link">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>
                    <a href="mailto:contact@realdarkplanet.com" class="social-link">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>

                <div class="copyright">RDP © 2025</div>
            </div>

        </div>
    </div>

    <audio id="bg-audio" loop>
        <source src="media/jazz.mp3" type="audio/mpeg">
    </audio>

    <script>
        /* --- 1. COUNTDOWN LOGIC --- */
        function updateCountdown() {
            const targetDate = new Date("December 29, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.querySelector('.time-code').innerText = "SYSTEM_UNLOCKED";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            const ms = Math.floor((distance % 1000) / 10);

            const timeString = `T-${days}:${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}:${ms.toString().padStart(2, '0')}`;
            document.querySelector('.time-code').innerText = timeString;
        }
        setInterval(updateCountdown, 41); 

        /* --- 2. AUDIO TOGGLE LOGIC --- */
        const audio = document.getElementById('bg-audio');
        const visualizer = document.querySelector('.audio-viz');
        const bars = document.querySelectorAll('.audio-viz span');
        let isPlaying = false;

        visualizer.style.opacity = '0.3';
        bars.forEach(bar => bar.style.animationPlayState = 'paused');
        audio.volume = 0.4;

        visualizer.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                visualizer.style.opacity = '0.3';
                bars.forEach(bar => bar.style.animationPlayState = 'paused');
            } else {
                audio.play().catch(e => console.log("Audio play failed:", e));
                visualizer.style.opacity = '1';
                bars.forEach(bar => bar.style.animationPlayState = 'running');
            }
            isPlaying = !isPlaying;
        });
    </script>

</body>
</html>

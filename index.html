<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL DARK PLANET // SYSTEM ACCESS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="monitor-bezel">
        <div class="crt-screen">
            
            <div class="scanlines"></div>
            <div class="screen-glow"></div>

            <div class="header-bar">
                <span>RDP-OS v3.0 [OFFLINE]</span>
                <span class="blink">SIGNAL LOST</span>
            </div>

            <main class="content-wrapper">
                
                <div class="eye-container">
                    <div class="radar-sweep"></div>
                    <img src="media/logo-red.png" alt="RDP EYE" class="rdp-eye">
                </div>

                <p class="terminal-text">
                    ENTER DECRYPTION KEY:
                </p>

                <div id="mc_embed_shell">
                    <div id="mc_embed_signup">
                        <form action="YOUR_MAILCHIMP_ACTION_URL_HERE" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate="">
                            
                            <div class="input-group">
                                <div class="progress-bar-container">
                                    <div class="progress-blocks">
                                        <span></span><span></span><span></span><span></span><span></span>
                                        <span></span><span></span><span></span>
                                    </div>
                                    <input type="email" value="" name="EMAIL" class="required email terminal-input" id="mce-EMAIL" required="" placeholder="████████">
                                </div>
                                
                                <div class="submit-container">
                                    <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button terminal-btn" value="[ EXECUTE ]">
                                </div>
                            </div>

                            <div id="mce-responses" class="clear foot">
                                <div class="response" id="mce-error-response" style="display: none;"></div>
                                <div class="response" id="mce-success-response" style="display: none;"></div>
                            </div>
                            
                            <div aria-hidden="true" style="position: absolute; left: -5000px;">
                                <input type="text" name="b_YOUR_TAG_HERE" tabindex="-1" value="">
                            </div>

                        </form>
                    </div>
                </div>

            </main>

            <footer class="terminal-footer">
                <div class="spectrogram">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    </div>
                <div class="mute-text">MUTE</div>
            </footer>

        </div> </div> </body>
</html>

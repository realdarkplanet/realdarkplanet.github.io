<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL DARK PLANET // SYSTEM ACCESS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="terminal-cutout">
        
        <div class="cctv-grid"></div>
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <div class="screen-content">
            
            <div class="status-bar">
                <span>REC [●]</span>
                <span class="time-code">00:00:00:00</span>
                <span>CAM_04</span>
            </div>

            <div class="center-stage">
                <div class="radar-housing">
                    <div class="radar-sweep"></div>
                    <img src="media/logo-red.png" alt="RDP EYE" class="rdp-eye">
                </div>
            </div>

            <div class="command-zone">
                <p class="cmd-prompt">ENTER_DECRYPTION_KEY:</p>
                
                <div id="mc_embed_shell">
                    <div id="mc_embed_signup">
                        <form action="YOUR_MAILCHIMP_ACTION_URL_HERE" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate="">
                            
                            <div class="input-wrapper">
                                <span class="arrow">></span>
                                <input type="email" value="" name="EMAIL" class="terminal-input" id="mce-EMAIL" required="" placeholder="___">
                                <button type="submit" class="submit-btn">EXEC</button>
                            </div>

                            <div aria-hidden="true" style="position: absolute; left: -5000px;">
                                <input type="text" name="b_YOUR_TAG_HERE" tabindex="-1" value="">
                            </div>

                        </form>
                    </div>
                </div>
            </div>

            <div class="footer-bar">
                <div class="audio-viz">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="copyright">RDP © 2025</div>
            </div>

        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeString = now.toISOString().split('T')[1].slice(0, 8);
            const ms = Math.floor(now.getMilliseconds() / 10).toString().padStart(2, '0');
            document.querySelector('.time-code').innerText = `${timeString}:${ms}`;
        }
        setInterval(updateTime, 40);
    </script>

</body>
</html>

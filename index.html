<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL DARK PLANET // SYSTEM ACCESS</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

    <div class="crt-overlay"></div>
    <div class="scanlines"></div>

    <div class="terminal-container">
        
        <div class="header-bar">
            <span>RDP-OS v3.0 [UNSECURED]</span>
            <span class="blink">SIGNAL DETECTED...</span>
        </div>

        <main class="content-wrapper">
            
            <div class="eye-container">
                <div class="radar-sweep"></div>
                <img src="media/logo.png" alt="RDP EYE" class="rdp-eye">
            </div>

            <h1 class="glitch-text" data-text="BECOME AWARE">BECOME AWARE</h1>

            <p class="terminal-text">
                > INITIALIZING CONNECTION...<br>
                > ENTER CREDENTIALS TO RECEIVE DROP DATA.
            </p>

            <div id="mc_embed_shell">
                <div id="mc_embed_signup">
                    <form action="YOUR_MAILCHIMP_ACTION_URL_HERE" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate="">
                        
                        <div class="input-group">
                            <span class="prompt">USER@RDP:~$</span>
                            <input type="email" value="" name="EMAIL" class="required email terminal-input" id="mce-EMAIL" required="" placeholder="ENTER_EMAIL_ADDRESS_">
                        </div>

                        <div id="mce-responses" class="clear foot">
                            <div class="response" id="mce-error-response" style="display: none;"></div>
                            <div class="response" id="mce-success-response" style="display: none;"></div>
                        </div>
                        
                        <div aria-hidden="true" style="position: absolute; left: -5000px;">
                            <input type="text" name="b_YOUR_TAG_HERE" tabindex="-1" value="">
                        </div>

                        <div class="submit-container">
                            <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button terminal-btn" value="[ EXECUTE_LOGIN ]">
                        </div>

                    </form>
                </div>
            </div>

        </main>

        <footer class="terminal-footer">
            <div class="spectrogram">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="copyright">
                &copy; 2025 REAL DARK PLANET // ALL RIGHTS RESERVED
            </div>
        </footer>

    </div>

</body>
</html>
